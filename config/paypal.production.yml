# PayPal recurring-donation settings, PRODUCTION environment.
# Mirror of config/paypal.sandbox.yml: both files must keep exactly the same keys, only the
# values differ. Everything here is public (client id, plan ids); the app secret never goes in a file.
environment: production
# TODO before going live: the LIVE app's client id (developer dashboard, Live toggle).
client_id: ""
currency: USD

# Same model as sandbox: the donor's amount IS the quantity of a 1 USD plan.
unit_price: 1
minimum_amount: 5
maximum_amount: 10000
preset_amounts: [5, 10, 25]

# TODO before going live: product and plans created in the LIVE account. The product already
# exists as a draft ("Apoyo a Devocionales Cristianos") but its id is not recorded yet, and the two
# plans (monthly, yearly, 1 USD per unit, quantity pricing) are not created.
product_id: ""
plans:
  monthly: ""
  yearly: ""
