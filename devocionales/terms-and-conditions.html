<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KBGE96RQML"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KBGE96RQML');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Términos y Condiciones de Uso - Devocionales Cristianos</title>
    <meta name="title-key" content="legal.terms.title">
    <meta name="description" content="Términos y Condiciones de Uso de la aplicación Devocionales Cristianos. Normativas y condiciones de uso de la aplicación móvil.">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="/devocionales/css/modern.css">
    <link rel="stylesheet" href="/devocionales/css/language-selector.css">
    <script src="/js/rtl-helper.js"></script>
    <script src="/devocionales/js/i18n.js"></script>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>

    <style>
        :root {
            --bg: #f5f2fb;
            --surface: #ffffff;
            --text: #1c1730;
            --text-muted: #6b6280;
            --border: #ded4ef;
            --accent: #6d4aa8;
            --accent-soft: #ece5f7;
            --highlight: #a8461c;
        }
        :root[data-theme="dark"] {
            --bg: #0b0b0a;
            --surface: #151412;
            --text: #f2f0ea;
            --text-muted: #a39e91;
            --border: #2a2822;
            --accent: #5fb8ae;
            --accent-soft: #16302d;
            --highlight: #e08a5c;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b0b0a;
                --surface: #151412;
                --text: #f2f0ea;
                --text-muted: #a39e91;
                --border: #2a2822;
                --accent: #5fb8ae;
                --accent-soft: #16302d;
                --highlight: #e08a5c;
            }
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

        .site-nav { border-bottom: 1px solid var(--border); background: var(--bg); }

        .theme-switch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }
        .theme-switch input { display: none; }
        .theme-switch .theme-switch-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: var(--text-muted);
            transition: color .15s ease;
        }
        .theme-switch .theme-switch-icon.is-active { color: var(--accent); }
        .theme-switch-track {
            position: relative;
            width: 2.25rem;
            height: 1.25rem;
            border-radius: 9999px;
            background: var(--border);
            transition: background .15s ease;
        }
        .theme-switch input:checked ~ .theme-switch-track { background: var(--accent); }
        .theme-switch-dot {
            position: absolute;
            top: 0.15rem;
            left: 0.15rem;
            width: 0.95rem;
            height: 0.95rem;
            border-radius: 50%;
            background: var(--surface);
            transition: transform .15s ease;
        }
        .theme-switch input:checked ~ .theme-switch-track .theme-switch-dot { transform: translateX(1rem); }

        /* Neutralize the shared language-selector's hardcoded purple */
        .language-selector-button.bg-purple-700 {
            background-color: var(--surface) !important;
            border-color: var(--border) !important;
            color: var(--text) !important;
        }
        .language-selector-button.bg-purple-700:hover {
            background-color: var(--accent-soft) !important;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            border-radius: 0.25rem;
            font-weight: 600;
            transition: opacity .15s ease;
        }
        .btn-primary:hover { opacity: 0.85; }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 0.25rem;
            font-weight: 600;
        }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

        .legal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 2rem;
        }
        .legal-card h1 { color: var(--text); }
        .legal-card h2 { color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: .5rem; margin-top: 2rem; }
        .legal-card h3 { color: var(--text); margin-top: 1.25rem; }
        .legal-card p, .legal-card ul, .legal-card ol { color: var(--text-muted); margin-bottom: 1em; overflow-wrap: break-word; }
        .legal-card a { color: var(--accent); overflow-wrap: break-word; }

        /* modern.css has a blanket "footer, footer * { color: white !important }"
           rule for other pages' dark footers — override it here so this page's
           theme-aware footer text stays readable in light mode. */
        footer#page-footer, footer#page-footer * { color: var(--text-muted) !important; }
    </style>
</head>
<body>

    <header class="site-nav">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <a href="/" class="font-bold text-lg tracking-tight" style="color: var(--text);">Develop4God</a>
            <div class="flex items-center gap-3">
                <a href="/devocionales/" class="btn-secondary px-3 py-1.5 text-sm flex items-center gap-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span data-i18n="legal.terms.backToHome">Volver al inicio</span>
                </a>
                <div id="language-selector"></div>
                <!-- label wraps its own input; for attribute kept for clarity -->
                <!-- [html-validate-disable-next no-redundant-for] -->
                <label class="theme-switch" for="theme-toggle" aria-label="Cambiar tema">
                    <i data-lucide="sun" class="theme-switch-icon theme-icon-light"></i>
                    <input type="checkbox" id="theme-toggle">
                    <span class="theme-switch-track">
                        <span class="theme-switch-dot"></span>
                    </span>
                    <i data-lucide="moon" class="theme-switch-icon theme-icon-dark"></i>
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <div class="legal-card">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-center mb-4" data-i18n="legal.terms.title">Términos y Condiciones de Uso de la Aplicación "Devocionales Cristianos"</h1>

            <div id="legal-terms-meta" class="text-center text-sm mb-8" style="color: var(--text-muted);"></div>

            <div class="prose prose-lg max-w-none">
                <!-- Dynamic legal content injected from translations -->
                <div id="legal-terms-content"></div>

                <div class="text-center mt-12 pt-6" style="border-top: 1px solid var(--border);">
                    <a href="/devocionales/" class="btn-primary inline-flex items-center gap-2 px-6 py-3">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span data-i18n="legal.terms.backToHome">Volver a la página principal</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer id="page-footer" class="mt-12 py-8 text-center text-sm" style="border-top: 1px solid var(--border); color: var(--text-muted);">
        <p id="footer-tagline" data-i18n="footer.copyright">&copy; 2025 Devocionales Cristianos. Todos los derechos reservados.</p>
        <a id="footer-contact-mail" href="mailto:develop4God@gmail.com" style="color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px; margin-top: 8px;">
            <i data-lucide="mail" class="w-4 h-4"></i>
            <span data-i18n="footer.contact">Contáctanos</span>
        </a>
        <p style="margin-top: 8px;">
            <a href="/devocionales/privacy-policy.html" style="color: var(--text-muted);" data-i18n="footer.privacy">Política de Privacidad</a>
            &nbsp;&middot;&nbsp;
            <a href="/devocionales/terms-and-conditions.html" style="color: var(--text-muted);" data-i18n="footer.terms">Términos y Condiciones</a>
        </p>
    </footer>

    <script src="/devocionales/js/modern.js"></script>
    <script>
        lucide.createIcons();

        (function () {
            const toggle = document.getElementById('theme-toggle');
            const iconDark = toggle.parentElement.querySelector('.theme-icon-dark');
            const iconLight = toggle.parentElement.querySelector('.theme-icon-light');

            function currentTheme() {
                const attr = document.documentElement.getAttribute('data-theme');
                if (attr) return attr;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function syncSwitch() {
                const isDark = currentTheme() === 'dark';
                toggle.checked = isDark;
                iconDark.classList.toggle('is-active', isDark);
                iconLight.classList.toggle('is-active', !isDark);
            }

            toggle.addEventListener('change', () => {
                const next = toggle.checked ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                syncSwitch();
            });

            syncSwitch();
        })();
    </script>
</body>
</html>
